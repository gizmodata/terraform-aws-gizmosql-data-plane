{{- range $tenant, $cfg := .Values.tenants }}
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gizmosql-{{ $tenant }}
spec:
  amiSelectorTerms:
    - alias: {{ required "amiAlias is required" $.Values.amiAlias }}
  role: {{ required "nodeRoleName is required" $.Values.nodeRoleName }}
  instanceStorePolicy: RAID0
  {{- if $.Values.userData }}
  userData: |-
{{ $.Values.userData | indent 4 }}
  {{- end }}
  subnetSelectorTerms:
    {{- if $.Values.subnetIds }}
    {{- range $.Values.subnetIds }}
    - id: {{ . }}
    {{- end }}
    {{- else }}
    - tags:
        karpenter.sh/discovery: {{ $.Values.clusterName }}
    {{- end }}
  # Prefer the node security group BY ID: a node SG orphaned by an earlier cluster build
  # can keep the discovery tag, so every Karpenter node gets two cluster-tagged SGs and the
  # AWS load balancer controller refuses to reconcile NLB target groups ("expected exactly
  # one securityGroup tagged with kubernetes.io/cluster/…"). Selecting by tag is only for
  # clusters whose node SGs this stack doesn't own.
  securityGroupSelectorTerms:
    {{- if $.Values.nodeSecurityGroupId }}
    - id: {{ $.Values.nodeSecurityGroupId }}
    {{- else }}
    - tags:
        karpenter.sh/discovery: {{ $.Values.clusterName }}
    {{- end }}
  # Bottlerocket's two volumes, both encrypted with the tenant's key: /dev/xvda is the OS
  # (a few GiB is plenty) and /dev/xvdb is the data volume (images, logs, host containers;
  # pod ephemeral storage is on the RAID0 instance store). Listing blockDeviceMappings
  # replaces Karpenter's Bottlerocket defaults, so both must be here: before 0.2.0 only
  # /dev/xvda was, and /dev/xvdb came from the AMI snapshot unencrypted. The field is
  # `kmsKeyID` (the 0.1.x `kmsKeyId` was pruned by the API server).
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: {{ required "osVolumeSize is required" $.Values.osVolumeSize }}
        volumeType: gp3
        encrypted: true
        kmsKeyID: {{ required "kmsKeyArn is required" $cfg.kmsKeyArn }}
        deleteOnTermination: true
    - deviceName: /dev/xvdb
      ebs:
        volumeSize: {{ required "dataVolumeSize is required" $.Values.dataVolumeSize }}
        volumeType: gp3
        encrypted: true
        kmsKeyID: {{ $cfg.kmsKeyArn }}
        deleteOnTermination: true
  tags:
    {{- range $k, $v := $.Values.tags }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    karpenter.sh/discovery: {{ $.Values.clusterName }}
    tenant: {{ $tenant }}
{{- end }}
